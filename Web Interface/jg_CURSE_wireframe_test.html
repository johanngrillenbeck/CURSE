<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>jg_CURSE Wireframe Test</title>
  <style>
    :root{
      --bg:#808080;
      --panel-bg:#7f7f7f;
      --button-yellow:#f0d555;
      --button-purple:#7f4bd6;
      --button-red:#b85b55;
      --pad:#bdbdbd;
      --pad-border:#7a7a7a;
      --card-shadow: 0 6px 0 rgba(0,0,0,0.4);
      --text-dark:#111;
    }
    html,body{height:100%;margin:0;font-family:Arial, Helvetica, sans-serif;background:var(--bg)}
    .stage{height:100vh;display:flex;align-items:stretch;justify-content:space-between;padding:36px}

    /* left area with buttons */
    .left{width:46%;min-width:420px;background:transparent;display:flex;flex-direction:column;gap:22px}
    .spacer{flex:1}
    .btn{
      width:260px;padding:22px 20px;border-radius:6px;box-shadow:var(--card-shadow);border:4px solid rgba(0,0,0,0.25);font-weight:700;font-size:20px;color:var(--text-dark);
    }
    .btn-yellow{background:var(--button-yellow)}
    .btn-purple{background:var(--button-purple);color:#fff}
    .btn-red{background:var(--button-red);color:#fff}

    /* right keypad column */
    .right{width:240px;display:flex;align-items:center;justify-content:center;position:relative}
    .keypad-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
    .vertical-label{position:absolute;right:80px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:center;font-weight:700;color:#222}
    .key-grid{display:grid;grid-template-columns:repeat(2,72px);grid-auto-rows:72px;gap:10px;padding:12px;background:transparent}
    .key{background:var(--pad);border:6px solid var(--pad-border);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,0.35)}
    .key.big{font-size:40px}

    /* vertical separators to mimic wireframe lines */
    .stage:before,.stage:after{content:"";position:absolute;top:60px;bottom:60px;width:2px;background:rgba(0,0,0,0.25)}
    .stage:before{left:62%;transform:none}
    .stage:after{right:312px}

    /* make it look neat on small widths */
    @media (max-width:980px){
      .left{width:100%;min-width:0;padding-right:12px}
      .right{position:static;width:100%;padding-top:24px}
      .stage{flex-direction:column;align-items:flex-start}
      .stage:before,.stage:after{display:none}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <div style="height:18px"></div>
      <div class="btn btn-yellow">Route selected tracks to new Send FX</div>
      <div class="btn btn-purple">Route selected tracks to new bus</div>
      <div class="btn btn-red">Add VCA Lead Track for selected Tracks</div>
      <div class="spacer"></div>
    </div>

    <div class="right" aria-hidden="false">
      <div class="vertical-label">Map last touched track to MIDI Channel</div>
      <div class="keypad-wrap">
        <div class="key-grid">
          <div class="key">1</div>
          <div class="key">2</div>
          <div class="key">3</div>
          <div class="key">4</div>
          <div class="key">5</div>
          <div class="key">6</div>
          <div class="key">7</div>
          <div class="key">8</div>
          <div class="key">9</div>
          <div class="key">10</div>
          <div class="key">11</div>
          <div class="key">12</div>
          <div class="key big">13</div>
          <div class="key big">14</div>
          <div class="key big">15</div>
          <div class="key big">16</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
